name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest

  # The same steps on native Windows. It also holds the stdio regression for
  # #65, which cannot fail on Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
