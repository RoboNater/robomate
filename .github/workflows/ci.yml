name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The minimum in pyproject.toml's required-version (#181).
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --all-packages --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -n auto
      # Each host verifies the whole matrix and that regeneration causes no drift.
      - run: uv run --locked python scripts/dependency-licenses.py --check
      - run: uv run --locked python scripts/dependency-licenses.py --update && git diff --exit-code docs/

  # The same steps on native Windows. It also holds the stdio regression for
  # #65, which cannot fail on Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The minimum in pyproject.toml's required-version (#181).
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --all-packages --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -n auto
      - run: uv run --locked python scripts/dependency-licenses.py --check
      - run: uv run --locked python scripts/dependency-licenses.py --update && git diff --exit-code docs/
