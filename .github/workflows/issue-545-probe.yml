name: Issue 545 Windows reproduction
on: pull_request
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.18"
      - run: uv sync --locked --all-packages --dev
      - name: Repeat before and after fix
        shell: pwsh
        run: |
          Copy-Item tests/test_agent_launcher.py "$env:RUNNER_TEMP/fixed.py"
          git checkout a288abcb7dab3911b6eff9c0e3022c2b2fde6361 -- tests/test_agent_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($version in @('baseline', 'fixed')) {
            if ($version -eq 'fixed') { Copy-Item "$env:RUNNER_TEMP/fixed.py" tests/test_agent_launcher.py }
            foreach ($iteration in 1..10) {
              Write-Host "$version iteration $iteration"
              uv run --locked pytest -n auto tests/test_agent_launcher.py::test_hanging_opencode_reports_pending_before_exit
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
