[project]
name = "robomate"
version = "0.1.0"
description = "Local hub that coordinates AI coding agents from issue to merged PR"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "agent-hub",
    "agent-hub-common",
    "robomate-cli",
    "worker-mcp",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    # #127: Starlette TestClient prefers httpx2; runtime clients still use httpx.
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
# The tested minimum: exclude-dependencies below needs a recent uv. CI pins the same version.
required-version = ">=0.12.18"
# #181: pywin32 bundles LGPL-2.1 adodbapi. packages/win32_compat provides the calls mcp makes.
# Only uv installs from this workspace honour this; see packages/win32_compat/README.md.
exclude-dependencies = ["pywin32"]

[tool.uv.sources]
agent-hub = { workspace = true }
agent-hub-common = { workspace = true }
robomate-cli = { workspace = true }
worker-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # #367: override fields of conftest's test HubSettings for one test.
    "hub_settings(**fields): override fields of the test hub's HubSettings",
]
filterwarnings = [
    # #127 / #123 option 3: fail DW/PDW from all modules, with targeted exceptions.
    'error::DeprecationWarning',
    'error::PendingDeprecationWarning',
    # StarletteDeprecationWarning inherits UserWarning and remains report-only.
    # ResourceWarning is a separate concern (#121), outside this category policy.
    # #210: Starlette 1.6.0 still accesses the alias; remove after an upstream fix.
    # AnyIO's deprecated alias is accessed by starlette.testclient (stacklevel=3).
    'ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:^starlette\.testclient$',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
exclude = ["docs/historical/**"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "tests"]
