[project]
name = "robomate"
version = "0.1.0"
description = "Local hub that coordinates AI coding agents from issue to merged PR"
requires-python = ">=3.12"
dependencies = [
    "agent-hub",
    "agent-hub-common",
    "robomate-cli",
    "worker-mcp",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.17,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-hub = { workspace = true }
agent-hub-common = { workspace = true }
robomate-cli = { workspace = true }
worker-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # #123 option 2: fail deprecations attributed to our packages and tests.
    # pytest imports tests as top-level test_* modules and conftest, not tests.*.
    'error::DeprecationWarning:^(agent_hub|agent_hub_common|robomate|worker_mcp|tests|test_[^.]+|conftest)(\.|$)',
    'error::PendingDeprecationWarning:^(agent_hub|agent_hub_common|robomate|worker_mcp|tests|test_[^.]+|conftest)(\.|$)',
    # Known upstream warnings in #123; remove each ignore when upstream fixes it.
    # Starlette's warning is attributed to fastapi.testclient by stacklevel=2.
    'ignore:^Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.$:DeprecationWarning:^fastapi\.testclient$',
    # AnyIO's deprecated alias is accessed by starlette.testclient (stacklevel=3).
    'ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:^starlette\.testclient$',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
exclude = ["docs/historical/**"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "tests"]
