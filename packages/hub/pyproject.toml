[project]
name = "agent-hub"
version = "0.1.0"
description = "A2A server and Alice-facing hub"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "agent-hub-common",
    "fastapi>=0.115,<1",
    "mcp>=1.26,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
hub = "agent_hub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.uv.sources]
agent-hub-common = { workspace = true }
