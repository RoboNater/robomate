[project]
name = "robomate-win32-compat"
version = "0.1.0"
description = "ctypes stand-in for the pywin32 calls mcp makes (#181)"
readme = "README.md"
license = "MIT"
# A copy of the repository's LICENSE, so the wheel and sdist carry the notice MIT
# requires; tests/test_win32_compat.py keeps it identical to the root file.
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
