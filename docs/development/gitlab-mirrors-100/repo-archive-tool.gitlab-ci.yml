# Linux equivalent of .github/workflows/ci.yml; runner01 has no Windows/macOS executor.
stages: [check]
variables:
  GIT_DEPTH: "0"
  UV_LINK_MODE: copy
checks:
  stage: check
  image: ghcr.io/astral-sh/uv:0.6.2-python3.12-bookworm-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git git-lfs
    - uv python install "$PYTHON_VERSION"
    - uv sync --locked --dev --python "$PYTHON_VERSION"
  script:
    - uv run --locked ruff format --check .
    - uv run --locked ruff check .
    - uv run --locked pytest
    - uv run --locked repo-archive --help
